<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Chá de Panela · Fernanda &amp; Matheus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
:root{
  --azul-serenity:      #8FA9C4;
  --azul-serenity-esc:  #6C8AAB;
  --azul-serenity-cl:   #C4D3E2;
  --off-white:          #F9F8F3;
  --rosa-quartzo:       #DCA498;
  --rosa-quartzo-esc:   #C67F71;
  --tinta:              #46403A;
  --tinta-suave:        #7A7369;
  --linha:              #E7E2D6;
  --branco:             #FFFFFF;
  --sombra: 0 10px 30px -12px rgba(70,64,58,0.18);
  --sombra-sm: 0 4px 14px -6px rgba(70,64,58,0.14);
  --raio: 18px;
  --raio-sm: 10px;
  --serif: 'Playfair Display', serif;
  --sans: 'Montserrat', 'Inter', -apple-system, sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--off-white);
  color:var(--tinta);
  font-family:var(--sans);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,.serif{font-family:var(--serif);}
button{font-family:var(--sans);}
img{max-width:100%;display:block;}
a{color:inherit;}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--azul-serenity-esc);
  outline-offset:2px;
}

.divisor-floral{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:22px 0;color:var(--rosa-quartzo-esc);
  user-select:none;
}
.divisor-floral .traco{height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--linha) 30%,var(--linha) 70%,transparent);}
.divisor-floral svg{width:22px;height:22px;opacity:.85;}

#app-shell{position:relative;min-height:100vh;}
#app{min-height:100vh;}

.pagina-convidado{
  max-width:480px;
  margin:0 auto;
  padding:36px 20px 60px;
}

.hero{text-align:center;padding-bottom:6px;}
.hero .monograma{
  font-family:var(--serif);
  font-style:italic;
  font-size:15px;
  letter-spacing:3px;
  color:var(--azul-serenity-esc);
  text-transform:uppercase;
}
.hero h1{
  margin:10px 0 4px;
  font-size:34px;
  font-weight:600;
  color:var(--tinta);
  line-height:1.15;
}
.hero h1 em{font-style:italic;color:var(--rosa-quartzo-esc);}
.hero .data-evento{
  font-size:13.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--tinta-suave);
  font-weight:500;
}
.hero .subtitulo{
  margin-top:14px;
  font-size:14.5px;
  color:var(--tinta-suave);
  max-width:360px;
  margin-left:auto;margin-right:auto;
}

.cartao{
  background:var(--branco);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  box-shadow:var(--sombra);
  padding:26px 22px;
  margin-top:18px;
}

.campo{margin-bottom:18px;}
.campo label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.6px;
  text-transform:uppercase;
  color:var(--tinta-suave);
  margin-bottom:8px;
}
.campo input[type="text"],
.campo input[type="url"],
.campo input[type="password"],
.campo select,
.campo textarea{
  width:100%;
  padding:13px 14px;
  border-radius:var(--raio-sm);
  border:1.5px solid var(--linha);
  background:var(--off-white);
  font-size:15px;
  color:var(--tinta);
  font-family:var(--sans);
  transition:border-color .15s ease;
}
.campo textarea{resize:vertical;min-height:84px;line-height:1.5;}
.campo input:focus, .campo select:focus, .campo textarea:focus{border-color:var(--azul-serenity);}
.campo .dica{font-size:11.5px;color:var(--tinta-suave);margin-top:6px;}

.radio-grupo{display:flex;flex-direction:column;gap:10px;}
.radio-opcao{
  display:flex;align-items:center;gap:12px;
  border:1.5px solid var(--linha);
  border-radius:var(--raio-sm);
  padding:13px 14px;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
}
.radio-opcao:hover{border-color:var(--azul-serenity-cl);}
.radio-opcao input{accent-color:var(--azul-serenity-esc);width:18px;height:18px;flex-shrink:0;}
.radio-opcao.selecionada{border-color:var(--azul-serenity-esc);background:rgba(143,169,196,0.08);}
.radio-opcao span{font-size:14.5px;font-weight:500;}

.botao{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  padding:14px 18px;
  border-radius:999px;
  border:none;
  font-size:14.5px;
  font-weight:600;
  letter-spacing:.3px;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.botao:active{transform:scale(0.98);}
.botao-primario{background:var(--azul-serenity-esc);color:var(--branco);box-shadow:0 8px 20px -8px rgba(108,138,171,0.65);}
.botao-primario:hover{background:var(--azul-serenity);}
.botao-secundario{background:var(--rosa-quartzo);color:var(--branco);box-shadow:0 8px 20px -8px rgba(198,127,113,0.55);}
.botao-secundario:hover{background:var(--rosa-quartzo-esc);}
.botao-fantasma{background:transparent;color:var(--tinta-suave);border:1.5px solid var(--linha);box-shadow:none;}
.botao-fantasma:hover{border-color:var(--rosa-quartzo);color:var(--rosa-quartzo-esc);}
.botao-desabilitado, .botao:disabled{
  background:var(--linha) !important;color:var(--tinta-suave) !important;box-shadow:none !important;cursor:not-allowed;
}
.botao-pequeno{width:auto;padding:9px 16px;font-size:12.5px;}
a.botao{text-decoration:none;}

.aviso{
  display:flex;gap:10px;align-items:flex-start;
  background:rgba(220,164,152,0.12);
  border:1px solid rgba(220,164,152,0.4);
  border-radius:var(--raio-sm);
  padding:13px 14px;
  font-size:12.8px;
  color:var(--tinta);
  margin:16px 0 20px;
}
.aviso svg{flex-shrink:0;width:18px;height:18px;color:var(--rosa-quartzo-esc);margin-top:1px;}
.aviso-ambiente{background:rgba(230,168,54,0.14);border-color:rgba(230,168,54,0.5);color:#6B4E12;}
.aviso-ambiente svg{color:#B8860B;}

.galeria-grid{
  columns:2 170px;
  column-gap:10px;
  margin:18px 0;
}
.galeria-item{
  break-inside:avoid;
  margin-bottom:10px;
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--sombra-sm);
  background:var(--azul-serenity-cl);
}
.galeria-item img{width:100%;display:block;}

.galeria-admin-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
  gap:10px;
  margin-top:14px;
}
.galeria-admin-item{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--linha);aspect-ratio:1/1;}
.galeria-admin-item img{width:100%;height:100%;object-fit:cover;}
.galeria-admin-remover{
  position:absolute;top:4px;right:4px;
  width:22px;height:22px;
  border-radius:50%;
  border:none;
  background:rgba(70,64,58,0.7);
  color:#fff;
  font-size:14px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.galeria-admin-remover:hover{background:var(--rosa-quartzo-esc);}

.grade-presentes{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  margin-top:18px;
}
@media (min-width:600px){.grade-presentes{grid-template-columns:1fr 1fr;}}

.categoria-secao{margin-top:8px;}
.categoria-secao + .categoria-secao{margin-top:30px;}
.categoria-titulo{
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--azul-serenity-esc);
  margin:0;
  padding-bottom:8px;
  border-bottom:2px solid var(--azul-serenity-cl);
}

.presente-card{
  background:var(--branco);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  overflow:hidden;
  box-shadow:var(--sombra-sm);
  display:flex;flex-direction:column;
}
.presente-foto{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--azul-serenity-cl);}
.presente-corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;}
.presente-nome{font-size:15.5px;font-weight:600;line-height:1.3;}
.presente-status{font-size:12px;font-weight:600;padding:8px 10px;border-radius:var(--raio-sm);text-align:center;}
.status-disponivel{color:var(--tinta-suave);}
.status-reservado-outro{background:rgba(70,64,58,0.06);color:var(--tinta-suave);}
.status-reservado-eu{background:rgba(220,164,152,0.16);color:var(--rosa-quartzo-esc);}
.presente-acoes{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:4px;}

.rodape-admin{text-align:center;margin-top:36px;padding-top:16px;border-top:1px solid var(--linha);}
.rodape-admin button{background:none;border:none;color:var(--tinta-suave);font-size:11.5px;letter-spacing:.4px;cursor:pointer;opacity:.55;padding:6px;}
.rodape-admin button:hover{opacity:1;color:var(--azul-serenity-esc);}

.pagina-admin{max-width:1180px;margin:0 auto;padding:32px 24px 70px;}
.admin-topo{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px;}
.admin-topo h1{font-size:26px;margin:0;font-weight:600;}
.admin-topo .subt{font-size:13px;color:var(--tinta-suave);margin-top:2px;}

.admin-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px;}
.resumo-card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio-sm);padding:16px 18px;box-shadow:var(--sombra-sm);}
.resumo-card .num{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--azul-serenity-esc);}
.resumo-card .rot{font-size:11.5px;color:var(--tinta-suave);letter-spacing:.4px;text-transform:uppercase;margin-top:2px;}

.admin-bloco{background:var(--branco);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra-sm);padding:22px 22px 26px;margin-bottom:26px;}
.admin-bloco-topo{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.admin-bloco-topo h2{font-size:17px;margin:0;font-weight:600;}

.tabela-wrap{width:100%;overflow-x:auto;}
table.planilha{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
table.planilha thead th{
  text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--tinta-suave);
  border-bottom:2px solid var(--linha);padding:10px 12px;white-space:nowrap;
}
table.planilha tbody td{padding:11px 12px;border-bottom:1px solid var(--linha);vertical-align:middle;}
table.planilha tbody tr:hover{background:rgba(143,169,196,0.06);}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;}
.tag-sim{background:rgba(143,169,196,0.18);color:var(--azul-serenity-esc);}
.tag-nao{background:rgba(70,64,58,0.08);color:var(--tinta-suave);}
.tag-livre{background:rgba(220,164,152,0.15);color:var(--rosa-quartzo-esc);}

.form-inline{display:grid;grid-template-columns:1.1fr 1fr 1.4fr auto;gap:10px;align-items:end;}
@media (max-width:920px){.form-inline{grid-template-columns:1fr;}}
.form-inline .campo{margin-bottom:0;}

.upload-foto{display:flex;align-items:center;gap:10px;}
.upload-foto .miniatura{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1.5px solid var(--linha);background:var(--azul-serenity-cl);flex-shrink:0;}
.upload-foto input[type="file"]{font-size:12px;width:100%;}
.upload-foto input[type="file"]::file-selector-button{
  border:1.5px solid var(--linha);background:var(--branco);border-radius:999px;padding:8px 12px;
  font-size:11.5px;font-weight:600;color:var(--tinta-suave);cursor:pointer;margin-right:8px;
}

.acoes-topo-direita{display:flex;gap:10px;flex-wrap:wrap;}
.rodape-nota{text-align:center;font-size:11.5px;color:var(--tinta-suave);margin-top:10px;}
.oculto{display:none !important;}

.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){.fade-in{animation:none;}}

.modal-overlay{
  position:fixed;inset:0;
  background:rgba(70,64,58,0.42);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  z-index:1000;
  animation:fadeIn .18s ease both;
  overflow-y:auto;
}
.modal-caixa{
  background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);
  padding:26px 24px;max-width:360px;width:100%;text-align:center;
  margin:auto;
}
.modal-caixa h3{margin:0 0 6px;font-size:19px;font-weight:600;}
.modal-caixa p{margin:0 0 16px;font-size:13.5px;color:var(--tinta-suave);}
.modal-caixa .campo{text-align:left;margin-bottom:16px;}
.modal-botoes{display:flex;gap:10px;margin-top:4px;}
.modal-botoes .botao{width:auto;flex:1;}
.modal-erro-msg{color:var(--rosa-quartzo-esc);font-size:12.5px;min-height:16px;margin:-8px 0 12px;}

#toast-container{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  z-index:2000;display:flex;flex-direction:column;gap:8px;
  width:calc(100% - 32px);max-width:400px;pointer-events:none;
}
.toast{
  background:var(--tinta);color:var(--branco);font-size:13px;font-weight:500;
  padding:12px 16px;border-radius:var(--raio-sm);box-shadow:var(--sombra);text-align:center;
  animation:fadeIn .2s ease both;
}
.toast.toast-erro{background:var(--rosa-quartzo-esc);}
</style>
</head>

async function lerChave(chave){
  if(!db) return null;
  try{
    const doc = await db.collection(COLECAO_META).doc(chave).get();
    return doc.exists ? JSON.parse(doc.data().dados) : null;
  }catch(e){
    console.error('Falha ao ler', chave, e);
    return null;
  }
}
async function gravarChave(chave, valor){
  if(!db) return false;
  try{
    await db.collection(COLECAO_META).doc(chave).set({ dados: JSON.stringify(valor), atualizadoEm: new Date().toISOString() });
    return true;
  }catch(e){
    console.error('Falha ao gravar', chave, e);
    return false;
  }
}

async function testarAmbienteStorage(){
  if(!db){ armazenamentoDisponivel = false; return; }
  try{
    const chaveTeste = 'cha_panela_teste_ambiente';
    const valorTeste = String(Date.now());
    await db.collection(COLECAO_META).doc(chaveTeste).set({ dados: valorTeste });
    const doc = await db.collection(COLECAO_META).doc(chaveTeste).get();
    armazenamentoDisponivel = !!(doc.exists && doc.data().dados === valorTeste);
  }catch(e){
    console.error('Teste de conexão com o Firestore falhou:', e);
    armazenamentoDisponivel = false;
  }
}
function bannerAmbiente(){
  if(armazenamentoDisponivel !== false) return '';
  return `

      <span><strong>Não foi possível conectar ao banco de dados.</strong> Verifique o <code>firebaseConfig</code> e as regras do Firestore.</span>
    </div>
  `;
}

function slugConvidado(nome){
  const base = String(nome||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
  return base || ('convidado-' + Date.now());
}

async function carregarDados(){
  if(refPresentes){
    try{
      const snap = await refPresentes.get();
      if(!snap.empty){
        presentes = snap.docs.map(d => ({ id:d.id, nome:d.data().nome, foto:d.data().foto, categoria: d.data().categoria || 'Outros', ordem: (typeof d.data().ordem === 'number') ? d.data().ordem : 9999, reservadoPor: d.data().reservadoPor || null }));
      }else{
        const lote = db.batch();
        PRESENTES_PADRAO.forEach(p => lote.set(refPresentes.doc(p.id), { nome:p.nome, foto:p.foto, categoria:'Outros', ordem:9999, reservadoPor:null }));
        await lote.commit();
        presentes = PRESENTES_PADRAO.map(p => ({ ...p, reservadoPor:null }));
      }
    }catch(e){
      console.error('Falha ao carregar presentes:', e);
      presentes = PRESENTES_PADRAO.map(p => ({ ...p, reservadoPor:null }));
    }
  }

  if(refConvidados){
    try{
      const snap = await refConvidados.get();
      convidados = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    }catch(e){ console.error('Falha ao carregar convidados:', e); convidados = []; }
  }

  if(refFotosCasa){
    try{
      const snap = await refFotosCasa.get();
      fotosCasa = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    }catch(e){ console.error('Falha ao carregar galeria:', e); fotosCasa = []; }
  }

  const cfg = await lerChave(CHAVE_CONFIG);
  if(cfg && typeof cfg === 'object'){
    configuracoes = { ...CONFIG_PADRAO, ...cfg };
  }else{
    configuracoes = { ...CONFIG_PADRAO };
    await gravarChave(CHAVE_CONFIG, configuracoes);
  }
}

function iniciarEscutaTempoReal(){
  if(!db) return;
  if(pararEscutaPresentes) pararEscutaPresentes();
  if(pararEscutaConvidados) pararEscutaConvidados();

  pararEscutaPresentes = refPresentes.onSnapshot(snap => {
    presentes = snap.docs.map(d => ({ id:d.id, nome:d.data().nome, foto:d.data().foto, categoria: d.data().categoria || 'Outros', ordem: (typeof d.data().ordem === 'number') ? d.data().ordem : 9999, reservadoPor: d.data().reservadoPor || null }));
    if(telaAtual === 'lista-presentes') desenharGradePresentes();
    if(telaAtual === 'admin'){ preencherTabelaPresentes(); preencherTabelaConvidados(); atualizarResumoAdmin(); }
  }, e => console.error('Erro ao escutar presentes:', e));

  pararEscutaConvidados = refConvidados.onSnapshot(snap => {
    convidados = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if(telaAtual === 'admin'){ preencherTabelaConvidados(); atualizarResumoAdmin(); }
  }, e => console.error('Erro ao escutar convidados:', e));
}

function redimensionarImagem(arquivo, larguraMax, qualidade){
  larguraMax = larguraMax || 640;
  qualidade = qualidade || 0.72;
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao carregar a imagem'));
      img.onload = () => {
        const escala = Math.min(1, larguraMax / img.width);
        const w = Math.round(img.width * escala);
        const h = Math.round(img.height * escala);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normalizarNome(n){ return String(n||'').trim().toLowerCase(); }
function formatarDataHora(iso){
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function garantirToastContainer(){
  let c = document.getElementById('toast-container');
  if(!c){
    c = document.createElement('div');
    c.id = 'toast-container';
    document.body.appendChild(c);
  }
  return c;
}
function mostrarToast(mensagem, tipo){
  const c = garantirToastContainer();
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'erro' ? ' toast-erro' : '');
  el.textContent = mensagem;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function abrirModal(innerHtml){
  fecharModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay-ativo';
  overlay.innerHTML = '<div class="modal-caixa">' + innerHtml + '</div>';
  overlay.addEventListener('click', (ev) => { if(ev.target === overlay) fecharModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function fecharModal(){
  const existente = document.getElementById('modal-overlay-ativo');
  if(existente) existente.remove();
}
function abrirModalConfirmacao(mensagem, aoConfirmar){
  const overlay = abrirModal(`
    <h3>Confirmar ação</h3>
    <p>${escapeHtml(mensagem)}</p>
    <div class="modal-botoes">
      <button type="button" class="botao botao-fantasma" id="modal-cancelar">Cancelar</button>
      <button type="button" class="botao botao-secundario" id="modal-confirmar">Confirmar</button>
    </div>
  `);
  overlay.querySelector('#modal-cancelar').addEventListener('click', fecharModal);
  overlay.querySelector('#modal-confirmar').addEventListener('click', () => { fecharModal(); aoConfirmar(); });
}

async function handleSubmitEntrada(ev){
  ev.preventDefault();
  const nome = document.getElementById('input-nome').value.trim();
  const rsvpEl = document.querySelector('input[name="rsvp"]:checked');
  if(!nome){ mostrarToast('Por favor, digite seu nome completo.', 'erro'); return; }
  if(!rsvpEl){ mostrarToast('Por favor, selecione se você vai comparecer.', 'erro'); return; }
  const rsvp = rsvpEl.value;
  nomeConvidadoAtual = nome;

  if(refConvidados){
    try{
      await refConvidados.doc(slugConvidado(nome)).set({ nome, rsvp, timestamp: new Date().toISOString() });
    }catch(e){
      console.error('Falha ao salvar resposta:', e);
      mostrarToast('Não foi possível salvar sua resposta agora. Tente novamente.', 'erro');
      return;
    }
  }

  if(rsvp === 'sim'){
    renderGaleriaCasa();
  }else{
    renderObrigadoNaoVai();
  }
}

// Dentro de cada categoria, presentes disponíveis vêm primeiro (na ordem de
// cadastro); os já reservados são jogados para o final da seção, para que
// o convidado veja primeiro o que ainda pode escolher.
function ordenarPresentesDaCategoria(itens){
  return [...itens].sort((a, b) => {
    const reservadoA = a.reservadoPor ? 1 : 0;
    const reservadoB = b.reservadoPor ? 1 : 0;
    if(reservadoA !== reservadoB) return reservadoA - reservadoB;
    return (a.ordem ?? 9999) - (b.ordem ?? 9999);
  });
}

function desenharGradePresentes(){
  const container = document.getElementById('grade-presentes-container');
  if(!container) return;

  const categoriasPresentes = [...new Set(presentes.map(p => p.categoria || 'Outros'))];
  const ordemCategorias = [...CATEGORIAS, ...categoriasPresentes.filter(c => !CATEGORIAS.includes(c))];

  const secoesHtml = ordemCategorias.map(categoria => {
    const itensDaCategoria = presentes.filter(p => (p.categoria || 'Outros') === categoria);
    if(!itensDaCategoria.length) return '';
    const itensOrdenados = ordenarPresentesDaCategoria(itensDaCategoria);
    const cards = itensOrdenados.map(renderizarCardPresente).join('');
    return `
      <div class="categoria-secao">
        <h3 class="categoria-titulo">${escapeHtml(categoria)}</h3>
        <div class="grade-presentes">${cards}</div>
      </div>
    `;
  }).join('');

  container.innerHTML = secoesHtml || '<p style="text-align:center;color:var(--tinta-suave);">Nenhum presente cadastrado ainda.</p>';

  container.querySelectorAll('.btn-reservar').forEach(btn => btn.addEventListener('click', () => reservarPresente(btn.dataset.id)));
  container.querySelectorAll('.btn-cancelar').forEach(btn => btn.addEventListener('click', () => cancelarReserva(btn.dataset.id)));
}


async function reservarPresente(id){
  if(!refPresentes){ mostrarToast('Sem conexão com o banco de dados agora.', 'erro'); return; }

  const ref = refPresentes.doc(id);
  let conflito = false;
  let nomeGuardado = null;

  try{
    await db.runTransaction(async (transacao) => {
      const doc = await transacao.get(ref);
      if(!doc.exists) return;
      const dados = doc.data();
      if(dados.reservadoPor){ conflito = true; return; }
      transacao.update(ref, { reservadoPor: nomeConvidadoAtual });
      nomeGuardado = dados.nome;
    });
  }catch(e){
    console.error('Falha ao reservar presente:', e);
    mostrarToast('Não foi possível concluir a reserva agora. Tente novamente.', 'erro');
    return;
  }

  if(conflito){
    mostrarToast('Ops! Esse presente acabou de ser reservado por outra pessoa. Escolha outro, por favor.', 'erro');
    return;
  }

  const p = presentes.find(p => p.id === id);
  if(p) p.reservadoPor = nomeConvidadoAtual;
  desenharGradePresentes();
  mostrarModalPosReserva(nomeGuardado || (p ? p.nome : ''));
}

      <button type="button" class="botao botao-fantasma" id="modal-continuar">Escolher mais um presente</button>
      <button type="button" class="botao botao-primario" id="modal-finalizar">Finalizar e Enviar Resposta</button>
    </div>
  `);
  overlay.querySelector('#modal-continuar').addEventListener('click', fecharModal);
  overlay.querySelector('#modal-finalizar').addEventListener('click', () => { fecharModal(); renderConfirmacaoFinal(); });
}

async function cancelarReserva(id){
  if(!refPresentes){ mostrarToast('Sem conexão com o banco de dados agora.', 'erro'); return; }
  const ref = refPresentes.doc(id);
  try{
    await db.runTransaction(async (transacao) => {
      const doc = await transacao.get(ref);
      if(!doc.exists) return;
      const dados = doc.data();
      if(normalizarNome(dados.reservadoPor) !== normalizarNome(nomeConvidadoAtual)) return;
      transacao.update(ref, { reservadoPor: null });
    });
  }catch(e){
    console.error('Falha ao cancelar reserva:', e);
    mostrarToast('Não foi possível cancelar agora. Tente novamente.', 'erro');
    return;
  }
  const p = presentes.find(p => p.id === id);
  if(p) p.reservadoPor = null;
  desenharGradePresentes();
}

    for(const arquivo of arquivos){
      try{
        const dataUrl = await redimensionarImagem(arquivo, 900, 0.7);
        await refFotosCasa.add({ dataUrl, criadoEm: new Date().toISOString() });
      }catch(e){
        console.error(e);
        mostrarToast('Não foi possível enviar uma das fotos.', 'erro');
      }
    }
    const snap = await refFotosCasa.get();
    fotosCasa = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    preencherGaleriaAdmin();
    mostrarToast('Fotos adicionadas à galeria!');
    ev.target.value = '';
  });
}

function atualizarResumoAdmin(){
  const totalEl = document.getElementById('resumo-total');
  if(!totalEl) return;
  const confirmados = convidados.filter(g => g.rsvp === 'sim').length;
  const declinados = convidados.filter(g => g.rsvp === 'nao').length;
  const reservados = presentes.filter(p => p.reservadoPor).length;
  totalEl.textContent = convidados.length;
  document.getElementById('resumo-confirmados').textContent = confirmados;
  document.getElementById('resumo-declinados').textContent = declinados;
  document.getElementById('resumo-reservados').textContent = reservados + '/' + presentes.length;
}

async function handleSalvarConfig(ev){
  ev.preventDefault();
  const dataEvento = document.getElementById('cfg-data').value.trim() || CONFIG_PADRAO.dataEvento;
  const mensagem = document.getElementById('cfg-mensagem').value.trim() || CONFIG_PADRAO.mensagem;
  const linkPinterest = document.getElementById('cfg-pinterest').value.trim();
  configuracoes = { dataEvento, mensagem, linkPinterest };
  await gravarChave(CHAVE_CONFIG, configuracoes);
  mostrarToast('Configurações salvas! Já valem para todo mundo que abrir o link.');
}

function preencherTabelaConvidados(){
  const tbody = document.getElementById('tbody-convidados');
  if(!tbody) return;
  if(convidados.length === 0){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--tinta-suave);padding:24px;">Nenhuma resposta recebida ainda.</td></tr>';
    return;
  }
  const linhas = [...convidados]
    .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))
    .map(g => {
      const meusPresentes = presentes.filter(p => normalizarNome(p.reservadoPor) === normalizarNome(g.nome));
      const tagPresenca = g.rsvp === 'sim' ? '<span class="tag tag-sim">Confirmou</span>' : '<span class="tag tag-nao">Declinou</span>';
      const nomesPresentes = meusPresentes.length ? meusPresentes.map(p => escapeHtml(p.nome)).join('; ') : '—';
      return `
        <tr>
          <td>${escapeHtml(g.nome)}</td>
          <td>${tagPresenca}</td>
          <td>${nomesPresentes}</td>
          <td>${formatarDataHora(g.timestamp)}</td>
          <td style="white-space:nowrap;">
            <button class="botao botao-fantasma botao-pequeno btn-editar-convidado" data-id="${g.id}">Editar</button>
            <button class="botao botao-fantasma botao-pequeno btn-remover-convidado" data-id="${g.id}">Remover</button>
          </td>
        </tr>
      `;
    }).join('');
  tbody.innerHTML = linhas;
  tbody.querySelectorAll('.btn-editar-convidado').forEach(btn => btn.addEventListener('click', () => abrirModalEditarConvidado(btn.dataset.id)));
  tbody.querySelectorAll('.btn-remover-convidado').forEach(btn => btn.addEventListener('click', () => removerConvidadoAdmin(btn.dataset.id)));
}

// Permite ao administrador corrigir o nome de um convidado (ex.: erro de
// digitação, entradas de teste). Se esse convidado já tiver presentes
// reservados, os vínculos são atualizados junto para o novo nome.
function abrirModalEditarConvidado(id){
  const convidado = convidados.find(c => c.id === id);
  if(!convidado) return;

  const overlay = abrirModal(`
    <h3>Editar convidado</h3>
    <form id="form-editar-convidado">
      <div class="campo">
        <label for="ec-nome">Nome completo</label>
        <input type="text" id="ec-nome" value="${escapeHtml(convidado.nome)}" required>
      </div>
      <div class="modal-botoes">
        <button type="button" class="botao botao-fantasma" id="ec-cancelar">Cancelar</button>
        <button type="submit" class="botao botao-primario">Salvar</button>
      </div>
    </form>
  `);

  overlay.querySelector('#ec-cancelar').addEventListener('click', fecharModal);
  overlay.querySelector('#form-editar-convidado').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const novoNome = overlay.querySelector('#ec-nome').value.trim();
    if(!novoNome){ mostrarToast('Digite um nome.', 'erro'); return; }

    try{
      await refConvidados.doc(id).update({ nome: novoNome });
      // Mantém os presentes já reservados por essa pessoa vinculados ao novo nome
      const presentesDela = presentes.filter(p => normalizarNome(p.reservadoPor) === normalizarNome(convidado.nome));
      if(presentesDela.length){
        const lote = db.batch();
        presentesDela.forEach(p => lote.update(refPresentes.doc(p.id), { reservadoPor: novoNome }));
        await lote.commit();
      }
    }catch(e){
      console.error(e);
      mostrarToast('Não foi possível salvar as alterações.', 'erro');
      return;
    }
    fecharModal();
    mostrarToast('Convidado atualizado com sucesso!');
  });
}

function removerConvidadoAdmin(id){
  const convidado = convidados.find(c => c.id === id);
  if(!convidado) return;
  abrirModalConfirmacao(`Remover "${convidado.nome}" da lista de convidados? Isso não libera automaticamente presentes já reservados por essa pessoa — se necessário, libere-os separadamente na tabela de presentes.`, async () => {
    try{
      await refConvidados.doc(id).delete();
      mostrarToast('Convidado removido.');
    }catch(e){
      console.error(e);
      mostrarToast('Não foi possível remover.', 'erro');
    }
  });
}


function preencherTabelaPresentes(){
  const tbody = document.getElementById('tbody-presentes');
  if(!tbody) return;
  tbody.innerHTML = presentes.map(p => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <img src="${p.foto}" alt="" style="width:36px;height:36px;border-radius:8px;object-fit:cover;border:1px solid var(--linha);flex-shrink:0;">
          ${escapeHtml(p.nome)}
        </div>
      </td>
      <td>${escapeHtml(p.categoria || 'Outros')}</td>
      <td>${p.reservadoPor ? '<span class="tag tag-nao">Reservado por ' + escapeHtml(p.reservadoPor) + '</span>' : '<span class="tag tag-livre">Disponível</span>'}</td>
      <td style="white-space:nowrap;">
        ${p.reservadoPor ? `<button class="botao botao-fantasma botao-pequeno btn-liberar-presente" data-id="${p.id}">Liberar Reserva</button>` : ''}
        <button class="botao botao-fantasma botao-pequeno btn-editar-presente" data-id="${p.id}">Editar</button>
        <button class="botao botao-fantasma botao-pequeno btn-remover-presente" data-id="${p.id}">Remover</button>
      </td>
    </tr>
  `).join('');
  tbody.querySelectorAll('.btn-remover-presente').forEach(btn => btn.addEventListener('click', () => removerPresente(btn.dataset.id)));
  tbody.querySelectorAll('.btn-editar-presente').forEach(btn => btn.addEventListener('click', () => abrirModalEditarPresente(btn.dataset.id)));
  tbody.querySelectorAll('.btn-liberar-presente').forEach(btn => btn.addEventListener('click', () => liberarReservaAdmin(btn.dataset.id)));
}

// Permite ao administrador cancelar a reserva de qualquer convidado
// (ex.: a pessoa desistiu de trazer o presente, ou pediu para trocar).
function liberarReservaAdmin(id){
  const presente = presentes.find(p => p.id === id);
  if(!presente) return;
  const nomeAtual = presente.reservadoPor;
  abrirModalConfirmacao(`Liberar a reserva de "${presente.nome}" (atualmente reservado por ${nomeAtual})?`, async () => {
    try{
      await refPresentes.doc(id).update({ reservadoPor: null });
      const p = presentes.find(p => p.id === id);
      if(p) p.reservadoPor = null;
      preencherTabelaPresentes();
      preencherTabelaConvidados();
      mostrarToast(`Reserva de "${presente.nome}" liberada.`);
    }catch(e){
      console.error(e);
      mostrarToast('Não foi possível liberar a reserva agora.', 'erro');
    }
  });
}


function abrirModalEditarPresente(id){
  const presente = presentes.find(p => p.id === id);
  if(!presente) return;
  fotoEdicaoDataUrl = null;

  const overlay = abrirModal(`
    <h3>Editar presente</h3>
    <form id="form-editar-presente">
      <div class="campo">
        <label for="ep-nome">Nome do item</label>
        <input type="text" id="ep-nome" value="${escapeHtml(presente.nome)}" required>
      </div>
      <div class="campo">
        <label for="ep-categoria">Categoria</label>
        <select id="ep-categoria">
          ${CATEGORIAS.map(c => `<option value="${escapeHtml(c)}" ${c === presente.categoria ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        </select>
      </div>
      <div class="campo">
        <label for="ep-foto">Foto</label>
        <div class="upload-foto">
          <img class="miniatura" id="ep-foto-preview" src="${presente.foto}" alt="Pré-visualização">
          <input type="file" id="ep-foto" accept="image/*">
        </div>
        <div class="dica">Deixe em branco para manter a foto atual.</div>
      </div>
      <div class="modal-botoes">
        <button type="button" class="botao botao-fantasma" id="ep-cancelar">Cancelar</button>
        <button type="submit" class="botao botao-primario">Salvar Alterações</button>
      </div>
    </form>
  `);

  overlay.querySelector('#ep-cancelar').addEventListener('click', fecharModal);
  overlay.querySelector('#ep-foto').addEventListener('change', async (ev) => {
    const arquivo = ev.target.files[0];
    if(!arquivo) return;
    try{
      fotoEdicaoDataUrl = await redimensionarImagem(arquivo);
      overlay.querySelector('#ep-foto-preview').src = fotoEdicaoDataUrl;
    }catch(e){ mostrarToast('Não foi possível carregar essa imagem.', 'erro'); }
  });
  overlay.querySelector('#form-editar-presente').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const nome = overlay.querySelector('#ep-nome').value.trim();
    if(!nome){ mostrarToast('Digite o nome do presente.', 'erro'); return; }
    const atualizacao = { nome, categoria: overlay.querySelector('#ep-categoria').value };
    if(fotoEdicaoDataUrl) atualizacao.foto = fotoEdicaoDataUrl;
    try{
      await refPresentes.doc(id).update(atualizacao);
    }catch(e){ console.error(e); mostrarToast('Não foi possível salvar as alterações.', 'erro'); return; }
    fecharModal();
    mostrarToast('Presente atualizado com sucesso!');
  });
}

async function handleAdicionarPresente(ev){
  ev.preventDefault();
  const nome = document.getElementById('np-nome').value.trim();
  if(!nome){ mostrarToast('Digite o nome do presente.', 'erro'); return; }
  const categoria = document.getElementById('np-categoria').value;
  const foto = fotoSelecionadaDataUrl || ('https://placehold.co/400x300/8FA9C4/FFFFFF?text=' + encodeURIComponent(nome));

  try{
    const novoId = refPresentes.doc().id;
    await refPresentes.doc(novoId).set({ nome, foto, categoria, ordem: Date.now(), reservadoPor:null });
  }catch(e){ console.error(e); mostrarToast('Não foi possível salvar o presente.', 'erro'); return; }

  document.getElementById('form-novo-presente').reset();
  fotoSelecionadaDataUrl = null;
  document.getElementById('np-foto-preview').src = 'https://placehold.co/100x100/E7E2D6/7A7369?text=%20';
  mostrarToast('"' + nome + '" foi adicionado à lista de presentes!');
}

// Importa o catálogo padrão (CATALOGO_PRESENTES) para o Firestore. Só
// adiciona itens cujo nome ainda não existe na lista atual, para poder
// ser clicado mais de uma vez com segurança (ex.: depois de receber mais
// fotos e atualizar o catálogo no código).
async function importarCatalogoPadrao(){
  if(!refPresentes){ mostrarToast('Sem conexão com o banco de dados agora.', 'erro'); return; }
  const nomesExistentes = new Set(presentes.map(p => normalizarNome(p.nome)));
  const itensNovos = CATALOGO_PRESENTES.filter(item => !nomesExistentes.has(normalizarNome(item.nome)));

  if(!itensNovos.length){
    mostrarToast('O catálogo padrão já foi todo importado — nenhum item novo encontrado.');
    return;
  }

  abrirModalConfirmacao(`Importar ${itensNovos.length} presente(s) novo(s) do catálogo padrão?`, async () => {
    try{
      const lote = db.batch();
      itensNovos.forEach(item => {
        const foto = item.foto || ('https://placehold.co/400x300/8FA9C4/FFFFFF?text=' + encodeURIComponent(item.nome));
        const ref = refPresentes.doc();
        lote.set(ref, { nome: item.nome, categoria: item.categoria, ordem: item.ordem, foto, reservadoPor: null });
      });
      await lote.commit();
      mostrarToast(`${itensNovos.length} presente(s) importado(s) com sucesso!`);
    }catch(e){
      console.error(e);
      mostrarToast('Não foi possível importar o catálogo agora.', 'erro');
    }
  });
}

function removerPresente(id){
  abrirModalConfirmacao('Remover este presente da lista?', async () => {
    try{
      await refPresentes.doc(id).delete();
      mostrarToast('Presente removido.');
    }catch(e){ console.error(e); mostrarToast('Não foi possível remover.', 'erro'); }
  });
}

function preencherGaleriaAdmin(){
  const grid = document.getElementById('galeria-admin-grid');
  if(!grid) return;
  if(!fotosCasa.length){
    grid.innerHTML = '<p style="font-size:12.5px;color:var(--tinta-suave);">Nenhuma foto adicionada ainda.</p>';
    return;
  }
  grid.innerHTML = fotosCasa.map(f => `
    <div class="galeria-admin-item">
      <img src="${f.dataUrl}" alt="">
      <button type="button" class="galeria-admin-remover" data-id="${f.id}" title="Remover">×</button>
    </div>
  `).join('');
  grid.querySelectorAll('.galeria-admin-remover').forEach(btn => btn.addEventListener('click', () => removerFotoCasa(btn.dataset.id)));
}

function removerFotoCasa(id){
  abrirModalConfirmacao('Remover esta foto da galeria de inspiração?', async () => {
    try{
      await refFotosCasa.doc(id).delete();
      fotosCasa = fotosCasa.filter(f => f.id !== id);
      preencherGaleriaAdmin();
      mostrarToast('Foto removida.');
    }catch(e){ console.error(e); mostrarToast('Não foi possível remover.', 'erro'); }
  });
}

async function exportarCsv(){
  if(typeof ExcelJS === 'undefined'){
    mostrarToast('Não foi possível carregar o gerador de planilha. Verifique sua conexão e tente de novo.', 'erro');
    return;
  }

  const wb = new ExcelJS.Workbook();
  wb.creator = 'Chá de Panela';
  wb.created = new Date();

  const ws = wb.addWorksheet('Convidados', {
    views: [{ state: 'frozen', ySplit: 3 }]
  });

  ws.columns = [
    { key: 'nome', width: 28 },
    { key: 'presenca', width: 16 },
    { key: 'presentes', width: 42 },
    { key: 'data', width: 22 },
  ];

  ws.mergeCells('A1:D1');
  const tituloCell = ws.getCell('A1');
  tituloCell.value = `Chá de Panela — ${NOIVOS.ela} & ${NOIVOS.ele}`;
  tituloCell.font = { name: 'Georgia', size: 16, bold: true, color: { argb: 'FF46403A' } };
  tituloCell.alignment = { horizontal: 'center', vertical: 'middle' };
  tituloCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF9F8F3' } };
  ws.getRow(1).height = 30;

  ws.mergeCells('A2:D2');
  const subCell = ws.getCell('A2');
  subCell.value = configuracoes.dataEvento;
  subCell.font = { name: 'Calibri', size: 11, italic: true, color: { argb: 'FF7A7369' } };
  subCell.alignment = { horizontal: 'center', vertical: 'middle' };
  subCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF9F8F3' } };
  ws.getRow(2).height = 20;

  const cabecalhos = ['Nome do Convidado', 'Presença', 'Presente(s) Reservado(s)', 'Data e Hora da Resposta'];
  const headerRow = ws.getRow(3);
  cabecalhos.forEach((titulo, i) => {
    const cell = headerRow.getCell(i + 1);
    cell.value = titulo;
    cell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF8FA9C4' } };
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    cell.border = { top:{style:'thin',color:{argb:'FF6C8AAB'}}, bottom: { style: 'medium', color: { argb: 'FF6C8AAB' } } };
  });
  headerRow.height = 24;

  const linhasOrdenadas = [...convidados].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  if(linhasOrdenadas.length === 0){
    ws.mergeCells('A4:D4');
    const vazioCell = ws.getCell('A4');
    vazioCell.value = 'Nenhuma resposta recebida ainda.';
    vazioCell.font = { name: 'Calibri', size: 11, italic: true, color: { argb: 'FF7A7369' } };
    vazioCell.alignment = { horizontal: 'center', vertical: 'middle' };
  }else{
    linhasOrdenadas.forEach((g, idx) => {
      const meusPresentes = presentes.filter(p => normalizarNome(p.reservadoPor) === normalizarNome(g.nome));
      const row = ws.addRow({
        nome: g.nome,
        presenca: g.rsvp === 'sim' ? 'Confirmou' : 'Declinou',
        presentes: meusPresentes.length ? meusPresentes.map(p => p.nome).join(', ') : '—',
        data: formatarDataHora(g.timestamp)
      });

      const corFundo = idx % 2 === 0 ? 'FFFFFFFF' : 'FFF9F8F3';
      row.eachCell({ includeEmpty: true }, cell => {
        cell.font = { name: 'Calibri', size: 11, color: { argb: 'FF46403A' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: corFundo } };
        cell.border = { bottom: { style: 'thin', color: { argb: 'FFE7E2D6' } } };
        cell.alignment = { vertical: 'middle', wrapText: true };
      });

      const presencaCell = row.getCell(2);
      presencaCell.font = {
        name: 'Calibri', size: 11, bold: true,
        color: { argb: g.rsvp === 'sim' ? 'FF6C8AAB' : 'FF7A7369' }
      };
      presencaCell.alignment = { horizontal: 'center', vertical: 'middle' };
      presencaCell.fill = {
        type: 'pattern', pattern: 'solid',
        fgColor: { argb: g.rsvp === 'sim' ? 'FFDCE7F0' : 'FFEDEAE4' }
      };

      row.height = 20;
    });
  }

  ws.autoFilter = { from: 'A3', to: 'D3' };

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cha_de_panela_convidados.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

(async function iniciar(){
  await testarAmbienteStorage();
  await carregarDados();
  iniciarEscutaTempoReal();
  renderEntrada();
})();
